services:
  - type: web
    name: mic-motor-insurance
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /up
    # Mounted at storage/ (not just storage/app/public) so the same
    # persistent disk holds both uploaded files AND the sqlite database
    # below — Render disks aren't billed by count on this plan, but one
    # disk keeps the setup simple and avoids a second mount to manage.
    disk:
      name: mic-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: "Motor Vehicle Insurance Portal"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: sqlite
      # Lives on the persistent disk mounted above, so it survives
      # redeploys; entrypoint.sh seeds it from the image's bundled
      # database/database.sqlite the first time this path doesn't exist.
      - key: DB_DATABASE
        value: /var/www/html/storage/database.sqlite
      - key: SESSION_DRIVER
        value: database
      # APP_URL is https:// in production, so the session cookie must be
      # marked Secure — otherwise it's usable over the plain-HTTP mixed-
      # content edge case and the "secure session cookie" claim isn't true.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: public
      # --- Mail (Mailtrap Sending API) ---
      - key: MAIL_MAILER
        value: mailtrap
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: "hello@demomailtrap.com"
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"
      # --- Secrets to fill in on the Render dashboard after first deploy ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: NAV_MAIL_ENABLED
        value: "false"
      - key: NAV_MAIL_WSDL
        sync: false
      - key: NAV_NTLM_DOMAIN
        sync: false
      - key: NAV_NTLM_USERNAME
        sync: false
      - key: NAV_NTLM_PASSWORD
        sync: false
